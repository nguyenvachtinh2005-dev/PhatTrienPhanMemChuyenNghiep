
<div class="login-page">
  <div class="login-container">

    <div class="login-header">
      <div class="login-logo">
        HealBooking
      </div>

      <h2>Đăng nhập</h2>

      <p>
        Chào mừng bạn đến với hệ thống đặt lịch khám bệnh trực tuyến
      </p>
    </div>

    <div class="success-message" *ngIf="successMessage">
      {{ successMessage }}
    </div>

    <div class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label for="email">Email</label>

        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="Nhập địa chỉ email"
        />

        <small
          class="field-error"
          *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.hasError('required')"
        >
          Vui lòng nhập email.
        </small>

        <small
          class="field-error"
          *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.hasError('email')"
        >
          Email không đúng định dạng.
        </small>
      </div>

      <div class="form-group">
        <label for="password">Mật khẩu</label>

        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="Nhập mật khẩu"
        />

        <small
          class="field-error"
          *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.hasError('required')"
        >
          Vui lòng nhập mật khẩu.
        </small>
      </div>

      <button type="submit" [disabled]="isLoading">
      {{ isLoading ? 'Đang đăng nhập...' : 'Đăng nhập' }}
    </button>

    </form>

    <div class="register-link">
      Chưa có tài khoản?
      <a routerLink="/register">Đăng ký tài khoản</a>
    </div>

  </div>
</div>
